services:
  mongo:
    image: mongo:7
    # single-node replica set: transactions require a replset, even locally
    command: ["--replSet", "rs0", "--bind_ip_all"]
    ports:
      - "27017:27017"
    healthcheck:
      test: |
        mongosh --quiet --eval "try { rs.status().ok } catch (e) { rs.initiate({_id:'rs0',members:[{_id:0,host:'localhost:27017'}]}).ok }"
      interval: 5s
      timeout: 10s
      retries: 12
      start_period: 5s
    volumes:
      - mongo-data:/data/db

volumes:
  mongo-data:
